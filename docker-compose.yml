services:
  postgres:
    image: postgres:16-alpine
    container_name: nublar-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: nublar
      POSTGRES_PASSWORD: nublar
      POSTGRES_DB: nublar
    volumes:
      - nublar_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nublar -d nublar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nublar_postgres:
